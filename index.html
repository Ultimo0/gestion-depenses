<!doctype html>
<html lang="fr">
  <head>
    <!-- Informations générales -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gestion de dépenses</title>

    <!-- Styles généraux -->
    <link rel="stylesheet" href="css/global.css" />

    <!-- Tableau de bord -->
    <link rel="stylesheet" href="css/dashboard.css" />

    <!-- Historique des transactions -->
    <link rel="stylesheet" href="css/transactions.css" />

    <!-- Fenêtre modale et formulaire -->
    <link rel="stylesheet" href="css/modal.css" />

    <!-- Adaptation aux petits écrans -->
    <link rel="stylesheet" href="css/responsive.css" />
  </head>

  <body>
    <!-- 1. En-tête de l'application -->
    <header class="entete">
      <div class="identite">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 64 64"
          class="logo-icon"
        >
          <defs>
            <linearGradient id="cuir" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#60A5FA" />
              <stop offset="45%" stop-color="#1D4ED8" />
              <stop offset="100%" stop-color="#172554" />
            </linearGradient>

            <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#FFFFFF" />
              <stop offset="50%" stop-color="#93C5FD" />
              <stop offset="100%" stop-color="#1E40AF" />
            </linearGradient>

            <filter id="ombre" x="-30%" y="-30%" width="160%" height="170%">
              <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
              <feOffset dy="2" />
              <feComponentTransfer>
                <feFuncA type="linear" slope="0.35" />
              </feComponentTransfer>
              <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <!-- Carte bancaire -->
          <rect
            x="16"
            y="5"
            width="32"
            height="21"
            rx="4"
            fill="#BFDBFE"
            stroke="white"
            stroke-width="1.5"
          />
          <rect x="21" y="11" width="8" height="6" rx="1" fill="#64748B" />
          <path d="M33 12H43M33 17H40" stroke="#1E40AF" stroke-width="1.5" />

          <!-- Corps en cuir -->
          <g filter="url(#ombre)">
            <rect
              x="6"
              y="20"
              width="52"
              height="37"
              rx="7"
              fill="url(#cuir)"
              stroke="#BFDBFE"
              stroke-width="1.5"
            />

            <!-- Poche avant -->
            <path
              d="M8 34H56V49C56 53 53 55 49 55H15C11 55 8 52 8 48Z"
              fill="#1E40AF"
              stroke="#93C5FD"
              stroke-width="1"
            />

            <!-- Rabat -->
            <path
              d="M7 32C7 28 10 26 14 26H44C52 26 57 30 57 37V43H42C38 43 35 40 35 36C35 32 38 29 42 29H52"
              fill="url(#cuir)"
              stroke="#DBEAFE"
              stroke-width="1.5"
              stroke-linejoin="round"
            />

            <!-- Reflet du cuir -->
            <path
              d="M13 29H34"
              stroke="#BFDBFE"
              stroke-width="1"
              stroke-linecap="round"
              opacity="0.7"
            />

            <!-- Coutures -->
            <path
              d="M12 48V51H51V47"
              stroke="#DBEAFE"
              stroke-width="1"
              stroke-dasharray="2 2"
              fill="none"
            />

            <!-- Bouton métallique -->
            <circle
              cx="44"
              cy="36"
              r="5"
              fill="url(#metal)"
              stroke="white"
              stroke-width="1"
            />
            <circle cx="44" cy="36" r="2" fill="#1E40AF" />
            <path
              d="M42 34L43 33"
              stroke="white"
              stroke-width="1"
              stroke-linecap="round"
            />
          </g>
        </svg>

        <h1>Kashmo</h1>
      </div>

      <p>Gérez. Épargnez. Réussissez.</p>
    </header>

    <!-- Contenu principal : cinq écrans + modale -->
    <main id="app">
      <!-- ===================== 1. ACCUEIL ===================== -->
      <section
        id="view-accueil"
        class="vue vue-accueil"
        data-view="accueil"
        aria-labelledby="titre-accueil"
      >
        <h2 id="titre-accueil" class="titre-vue">Accueil</h2>

        <!-- 2. Carte du solde -->
        <section class="carte-solde">
          <div class="icone-solde">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <!-- Sommet noué de la bourse -->
              <path d="M9 4.5c0 1.5 6 1.5 6 0" />
              <path d="M9 4.5 8 3" />
              <path d="m15 4.5 1-1" />

              <!-- Corps de la bourse -->
              <path
                d="M9 6.5C7 8 5 10.5 5 15c0 4 3 6 7 6s7-2 7-6c0-4.5-2-7-4-8.5"
              />

              <!-- Nœud -->
              <path d="M8 7.5c2.5 1.5 5.5 1.5 8 0" />

              <!-- Pièce générique -->
              <circle cx="12" cy="14" r="3" />
              <path d="M12 12.5v3" />
            </svg>
          </div>
          <p>Solde disponible</p>
          <h2 id="solde"></h2>
        </section>

        <!-- Paramètres de l'application -->
        <section class="section-parametres">
          <h2>Paramètres</h2>

          <div class="champ-formulaire">
            <label for="select-devise">Devise principale</label>

            <select id="select-devise">
              <option value="XAF">Franc CFA (FCFA)</option>
              <option value="EUR">Euro (€)</option>
              <option value="USD">Dollar américain ($)</option>
              <option value="GBP">Livre sterling (£)</option>
              <option value="CAD">Dollar canadien ($ CA)</option>
              <option value="CHF">Franc suisse (CHF)</option>
            </select>
          </div>
        </section>

        <!-- 3. Résumé financier -->
        <section class="resume-financier">
          <div class="carte-revenu">
            <div class="entete-carte">
              <p>Revenus</p>

              <div class="icone-revenu">
                <svg viewBox="0 0 24 24" fill="none">
                  <path
                    d="M3 17L9 11L13 15L21 7"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M15 7H21V13"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
            </div>

            <h3 id="total-revenus">0</h3>
          </div>

          <div class="carte-depense">
            <div class="entete-carte">
              <p>Dépenses</p>

              <div class="icone-depense">
                <svg viewBox="0 0 24 24" fill="none">
                  <path
                    d="M3 7L9 13L13 9L21 17"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M15 17H21V11"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
            </div>

            <h3 id="total-depenses">0</h3>
          </div>
        </section>
      </section>

      <!-- ===================== 2. TRANSACTIONS ===================== -->
      <section
        id="view-transactions"
        class="vue vue-transactions"
        data-view="transactions"
        aria-labelledby="titre-transactions"
        hidden
      >
        <h2 id="titre-transactions" class="titre-vue">Transactions</h2>

        <section class="section-ajout">
          <!-- Bouton flottant pour ouvrir le formulaire -->
          <button id="btn-ouvrir-formulaire" aria-label="Ajouter une transaction">
            +
          </button>
        </section>

        <!-- 5. Historique des transactions -->
        <section class="section-historique">
          <h2>Historique des transactions</h2>

          <!-- JavaScript insérera les transactions ici -->
          <ul id="liste-transactions"></ul>
        </section>
      </section>

      <!-- ===================== 3. STATISTIQUES ===================== -->
      <section
        id="view-statistiques"
        class="vue vue-statistiques"
        data-view="statistiques"
        aria-labelledby="titre-statistiques"
        hidden
      >
        <h2 id="titre-statistiques" class="titre-vue">Statistiques</h2>
        <p class="espace-reserve">Espace réservé.</p>
      </section>

      <!-- ===================== 4. ÉPARGNE ===================== -->
      <section
        id="view-epargne"
        class="vue vue-epargne"
        data-view="epargne"
        aria-labelledby="titre-epargne"
        hidden
      >
        <h2 id="titre-epargne" class="titre-vue">Épargne</h2>
        <p class="espace-reserve">Espace réservé.</p>
      </section>

      <!-- ===================== 5. PROFIL ===================== -->
      <section
        id="view-profil"
        class="vue vue-profil"
        data-view="profil"
        aria-labelledby="titre-profil"
        hidden
      >
        <h2 id="titre-profil" class="titre-vue">Profil</h2>
        <p class="espace-reserve">Espace réservé.</p>
      </section>

      <!-- Fenêtre modale (hors des vues, conservée dans le DOM) -->
      <div id="modal-formulaire" class="modal-cachee">
        <div class="contenu-modal">
          <div class="entete-modal">
            <h2>Nouvelle transaction</h2>

            <button type="button" id="btn-fermer-modal" aria-label="Fermer">
              &times;
            </button>
          </div>

          <form id="formulaire">
            <div class="champ-formulaire">
              <label for="champ-type">Type de transaction</label>

              <select id="champ-type" required>
                <option value="">Choisir un type</option>
                <option value="revenu">Revenu</option>
                <option value="depense">Dépense</option>
              </select>
            </div>

            <div class="champ-formulaire">
              <label for="champ-description">Description</label>
              <input
                type="text"
                id="champ-description"
                placeholder="Exemple : Salaire"
                required
              />
            </div>

            <div class="champ-formulaire">
              <label for="champ-montant">Montant</label>
              <input
                type="number"
                id="champ-montant"
                placeholder="Exemple : 5000"
                step="any"
                required
              />
            </div>

            <div class="champ-formulaire">
              <label for="champ-categorie">Catégorie</label>
              <select id="champ-categorie" required>
                <option value="">Choisir une catégorie</option>
                <option value="Salaire">Salaire</option>
                <option value="Vente">Vente</option>
                <option value="Transport">Transport</option>
                <option value="Nourriture">Nourriture</option>
                <option value="Internet">Internet</option>
                <option value="Loisirs">Loisirs</option>
                <option value="Autres">Autres</option>
              </select>
            </div>

            <button type="submit" id="btn-ajouter">
              Ajouter la transaction
            </button>
          </form>
        </div>
      </div>
    </main>

    <!-- Barre de navigation flottante premium en bas : cinq onglets -->
    <nav class="onglets-fixes" aria-label="Navigation principale">
      <button
        type="button"
        id="onglet-accueil"
        class="onglet"
        data-view="accueil"
        aria-label="Accueil"
        aria-current="page"
      >
        <svg class="onglet-icone" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M3 11 12 3.5 21 11" />
          <path d="M5 9.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5" />
          <path d="M9.5 20v-5h5v5" />
        </svg>
        <span class="onglet-label">Accueil</span>
      </button>

      <button
        type="button"
        id="onglet-transactions"
        class="onglet"
        data-view="transactions"
        aria-label="Transactions"
      >
        <svg class="onglet-icone" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M4 7h13" />
          <path d="M14 4l3 3-3 3" />
          <path d="M20 17H7" />
          <path d="M10 14l-3 3 3 3" />
        </svg>
        <span class="onglet-label">Transactions</span>
      </button>

      <button
        type="button"
        id="onglet-statistiques"
        class="onglet"
        data-view="statistiques"
        aria-label="Statistiques"
      >
        <svg class="onglet-icone" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M4 20v-9" />
          <path d="M10 20V4" />
          <path d="M16 20v-7" />
          <path d="M3 20h18" />
        </svg>
        <span class="onglet-label">Statistiques</span>
      </button>

      <button
        type="button"
        id="onglet-epargne"
        class="onglet"
        data-view="epargne"
        aria-label="Épargne"
      >
        <svg class="onglet-icone" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2V5z" />
          <path d="M2 10h2" />
          <circle cx="15" cy="10" r="1" fill="currentColor" stroke="none" />
        </svg>
        <span class="onglet-label">Épargne</span>
      </button>

      <button
        type="button"
        id="onglet-profil"
        class="onglet"
        data-view="profil"
        aria-label="Profil"
      >
        <svg class="onglet-icone" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9.2" />
          <circle cx="12" cy="9.5" r="3.2" />
          <path d="M5.8 19a6.2 6.2 0 0 1 12.4 0" />
        </svg>
        <span class="onglet-label">Profil</span>
      </button>
    </nav>

    <!-- 6. Fichier JavaScript -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
