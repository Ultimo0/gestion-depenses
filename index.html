<!doctype html>
<html lang="fr">
  <head>
    <!-- Informations générales -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gestion de dépenses</title>

    <!-- Fichier CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- 1. En-tête de l'application -->
    <header>
      <h1>Mon portefeuille</h1>
      <p>Gérez votre argent intelligemment.</p>
    </header>

    <!-- Contenu principal -->
    <main>
      <!-- 2. Carte du solde -->
      <section class="carte-solde">
        <p>Solde disponible</p>
        <h2 id="solde"></h2>
      </section>

      <!-- 3. Résumé financier -->
      <section class="resume-financier">
        <div class="carte-revenu">
          <p>Revenus</p>
          <h3 id="total-revenus">0 FCFA</h3>
        </div>

        <div class="carte-depense">
          <p>Dépenses</p>
          <h3 id="total-depenses">0 FCFA</h3>
        </div>
      </section>

      <!-- 4. Formulaire d'ajout -->
      <section>
        <form id="formulaire">
          <label for="champ-description"> Description </label>

          <input
            type="text"
            id="champ-description"
            placeholder="Exemple : Salaire"
            required
          />

          <label for="champ-montant"> Montant </label>

          <input
            type="number"
            id="champ-montant"
            placeholder="Exemple : 5000"
            aria-required=""
            step="any"
            required
          />

          <button type="submit" id="btn-ajouter">Ajouter</button>
        </form>
      </section>

      <!-- 5. Historique des transactions -->
      <section>
        <h2>Historique des transactions</h2>

        <!-- JavaScript insérera les transactions ici -->
        <ul id="liste-transactions"></ul>
      </section>
    </main>

    <!-- 6. Fichier JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
